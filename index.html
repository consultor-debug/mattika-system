<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATTIKA SYSTEM · Gestión de Contratos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  // Backend API URL — apunta al servicio Express en Easypanel.
  // Cambia a null para modo solo-localStorage (demo sin backend).
  window.MATTIKA_API = 'http://31.97.160.157:3001';
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="bundle-core.jsx"></script>
<script type="text/babel" src="data-store.jsx"></script>
<script type="text/babel" src="contract-template.jsx"></script>
<script type="text/babel" src="screen-dashboard.jsx"></script>
<script type="text/babel" src="screen-wizard.jsx"></script>
<script type="text/babel" src="screen-preview.jsx"></script>
<script type="text/babel" src="screen-pagos.jsx"></script>
<script type="text/babel" src="screen-plano.jsx"></script>
<script type="text/babel" src="plano-satelite.jsx"></script>
<script type="text/babel" src="screen-extras.jsx"></script>
<script type="text/babel" src="screen-admin-hub.jsx"></script>
<script type="text/babel" src="screen-condiciones.jsx"></script>
<script type="text/babel" src="screen-correo.jsx"></script>
<script type="text/babel" src="screen-proyectos.jsx"></script>
<script type="text/babel" src="screen-lotes-admin.jsx"></script>
<script type="text/babel" src="screen-lotes-admin-modals.jsx"></script>
<script type="text/babel">

// app.jsx — Shell, navegación y tweaks

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "brandColor": "#1E4FD4",
  "dark": false
}/*EDITMODE-END*/;

const NAV = [
// ── Operación diaria (flujo comercial) ──
{ id: 'dashboard', label: 'Dashboard', icon: 'dashboard', group: 'principal' },
{ id: 'plano', label: 'Plano', icon: 'mapPin', group: 'principal' },
{ id: 'inmuebles', label: 'Lotes', icon: 'building', group: 'principal' },
{ id: 'contracts', label: 'Contratos', icon: 'doc', group: 'principal', badge: 32 },
{ id: 'clients', label: 'Clientes', icon: 'users', group: 'principal' },
{ id: 'pagos', label: 'Pagos y cuotas', icon: 'money', group: 'principal' },
// ── Configuración de la empresa ──
{ id: 'proyectos', label: 'Proyectos y planos', icon: 'layers', group: 'config' },
{ id: 'condiciones', label: 'Condiciones comerciales', icon: 'scale', group: 'config', perm: 'editar_condiciones' },
{ id: 'templates', label: 'Plantillas', icon: 'template', group: 'config', perm: 'editar_plantillas' },
{ id: 'correo', label: 'Correo', icon: 'mail', group: 'config' },
{ id: 'asesores', label: 'Usuarios y equipo', icon: 'user', group: 'config' },
{ id: 'admin', label: 'Superusuario', icon: 'shield', group: 'config', perm: 'superusuario' },
{ id: 'settings', label: 'Ajustes', icon: 'settings', group: 'config' }];


// ── User card en sidebar — muestra usuario actual + cierre de sesión
const UserCard = ({ sesion, empresa, onLogout }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const off = (e) => { if (!ref.current?.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', off);
    return () => document.removeEventListener('mousedown', off);
  }, [open]);
  const initials = (sesion?.nombre || 'U U').split(' ').slice(0,2).map(s => s[0]).join('').toUpperCase();
  return (
    <div ref={ref} style={{position:'relative'}}>
      <button className="user-card" onClick={() => setOpen(v => !v)} title={`${sesion?.nombre} · ${sesion?.rol}`}
              style={{width:'100%', background:'transparent', border:0, padding:0, font:'inherit', textAlign:'left', cursor:'pointer'}}>
        <div className="avatar lg" style={{background: empresa?.color || 'var(--brand)'}}>{initials}</div>
        <div className="user-meta flex1">
          <div className="user-name">{sesion?.nombre}</div>
          <div className="user-role">{sesion?.rol} · {empresa?.nombre?.split(' ')[0]}</div>
        </div>
        <Icon name="chevronD" size={14} style={{ color: 'var(--muted)' }} />
      </button>
      {open && (
        <div style={{
          position:'absolute', bottom:'calc(100% + 8px)', left:0, right:0,
          background:'var(--surface)', border:'1px solid var(--border)',
          borderRadius:10, padding:6, boxShadow:'var(--shadow-md)', zIndex:50,
        }}>
          <div style={{padding:'8px 10px', borderBottom:'1px solid var(--hairline)', marginBottom:4}}>
            <div style={{fontSize:11, color:'var(--muted-2)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:600}}>Sesión activa</div>
            <div style={{fontSize:13, color:'var(--ink)', fontWeight:600, marginTop:2}}>{sesion?.nombre}</div>
            <div style={{fontSize:11.5, color:'var(--muted)'}}>{empresa?.nombre}</div>
          </div>
          <button onClick={onLogout}
                  style={{width:'100%', display:'flex', alignItems:'center', gap:8, padding:'8px 10px', background:'transparent', border:0, borderRadius:6, color:'var(--danger)', font:'inherit', fontSize:13, cursor:'pointer'}}
                  onMouseEnter={(e) => e.currentTarget.style.background='var(--danger-bg)'}
                  onMouseLeave={(e) => e.currentTarget.style.background='transparent'}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h14" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [sesion, setSesion] = useSesion();
  const [route, setRoute] = React.useState('dashboard');
  const [routeParams, setRouteParams] = React.useState({});
  const [wizardOpen, setWizardOpen] = React.useState(false);
  const [wizardInitial, setWizardInitial] = React.useState(null); // datos iniciales p/ pre-llenar wizard
  const [preview, setPreview] = React.useState(null); // generated doc data
  const [notifOpen, setNotifOpen] = React.useState(false);
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [mobileNav, setMobileNav] = React.useState(false); // drawer del menú en móvil
  const [sidebarCollapsed, setSidebarCollapsed] = React.useState(() => {
    try { return localStorage.getItem('mattika.sidebar.collapsed') === '1'; } catch (e) { return false; }
  });
  const toggleSidebar = () => setSidebarCollapsed((v) => {
    const next = !v;
    try { localStorage.setItem('mattika.sidebar.collapsed', next ? '1' : '0'); } catch (e) {}
    return next;
  });
  const [toast, toastNode] = useToasts();

  // Forzar re-render cuando cambia el contexto (proyecto/etapa).
  // IMPORTANTE: este hook debe vivir aquí arriba, ANTES de cualquier
  // return temprano, para no violar la regla de hooks de React.
  const [, forceCtx] = React.useReducer((x) => x + 1, 0);
  React.useEffect(() => {
    const handler = () => forceCtx();
    window.addEventListener('mattika:contexto-cambiado', handler);
    window.addEventListener('mattika:permisos-cambiado', handler);
    return () => {
      window.removeEventListener('mattika:contexto-cambiado', handler);
      window.removeEventListener('mattika:permisos-cambiado', handler);
    };
  }, []);

  // Exponer `goto` para que componentes auxiliares (ContextoSwitcher) puedan navegar.
  // Aquí arriba también — antes de los returns tempranos.
  React.useEffect(() => { window.__appGoto = (r, p) => { setRoute(r); setRouteParams(p || {}); setWizardOpen(false); setPreview(null); }; }, []);

  // Cmd/Ctrl+K abre búsqueda global
  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setSearchOpen(true);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Apply brand color + dark
  React.useEffect(() => {
    document.documentElement.style.setProperty('--brand', t.brandColor);
    document.documentElement.dataset.theme = t.dark ? 'dark' : 'light';
  }, [t.brandColor, t.dark]);

  const goto = (r, params = {}) => {
    setRoute(r);
    setRouteParams(params);
    setWizardOpen(false);
    setPreview(null);
    setMobileNav(false); // cerrar el menú en móvil al navegar
  };

  const startNew = (initialOrTipo) => {
    // initialOrTipo puede ser un objeto {inmueble, terminos} o un string (legacy)
    if (initialOrTipo && typeof initialOrTipo === 'object') {
      setWizardInitial(initialOrTipo);
    } else {
      setWizardInitial(null);
    }
    setWizardOpen(true);
    setPreview(null);
  };

  const handleGenerate = (data) => {
    setPreview(data);
    setWizardOpen(false);
    toast('Documento generado correctamente');
    // Save contract to API
    if (window.apiClient) {
      window.apiClient('/api/contratos', {
        method: 'POST',
        body: JSON.stringify({ datos: data }),
      }).catch(() => {});
    }
  };

  const openContract = (c) => {
    // Construir documento a partir de la fila de contrato
    const parts = c.cliente.split(' ');
    const nombres = parts.slice(0, parts.length >= 4 ? 2 : 1).join(' ');
    const apellidos = parts.slice(parts.length >= 4 ? 2 : 1).join(' ');
    // Parseo simple "Lote 7 · Manzana C"
    const loteMatch = c.unidad.match(/Lote\s+(\S+)/i);
    const mzMatch = c.unidad.match(/Manzana\s+(\S+)/i);

    const saldo = c.precio - c.inicial;
    const dummy = {
      titularidad: c.titularidad || 'unico',
      compradorA: {
        nombres, apellidos,
        dni: c.dni || '00000000',
        estadoCivil: 'Soltero(a)',
        ocupacion: '',
        telefono: '923 585 590',
        email: `${(nombres.split(' ')[0] || '').toLowerCase()}@correo.pe`,
        domicilio: 'Jr. Indico 432, La Esperanza, Trujillo, La Libertad'
      },
      compradorB: null,
      inmueble: {
        tipoInmueble: 'Lote',
        unidad: loteMatch ? loteMatch[1] : '7',
        manzana: mzMatch ? mzMatch[1] : 'C',
        proyecto: c.proyecto,
        direccion: 'Valle Chicama, Predio Mocan, Sector La Arenita U.C. 1900',
        distrito: 'Razuri', provincia: 'Ascope', departamento: 'La Libertad',
        partida: c.partida.replace('P-', ''),
        area: '140',
        linderoNorte: '', linderoSur: '', linderoEste: '', linderoOeste: ''
      },
      terminos: {
        precio: c.precio, inicial: c.inicial,
        modoCuotas: 'personalizadas',
        cuotasPersonalizadas: cuotasPorDefecto(saldo),
        cuotas: c.cuotasN || 3,
        primeraCuota: c.primeraCuota || '2026-05-31',
        formaPago: 'Depósito bancario',
        bancoNombre: 'BCP',
        bancoCuenta: '570-7307941059',
        numOperacion: '',
        plazoEntrega: '12.2027',
        penalidadDiaria: 30,
        porcLucroCesante: 30
      },
      meta: { asesorId: 'me', plantilla: 'tpl-1', fechaContrato: c.fecha, lugarFirma: 'Trujillo', notas: '' }
    };
    dummy.cronograma = generarCronograma(dummy.terminos);
    setPreview(dummy);
    setWizardOpen(false);
  };

  const curScreen = wizardOpen ? 'wizard' : preview ? 'preview' : route;
  const curNav = NAV.find((n) => n.id === route);

  const crumbs = (() => {
    if (wizardOpen) return ['Nuevo documento', 'Asistente'];
    if (preview) return [curNav?.label || 'Contratos', 'Documento generado'];
    return [curNav?.label || 'Dashboard'];
  })();

  // ─── Auth gates ─────────────────────────────────────────────
  // 1) No hay sesión → login
  if (!sesion) {
    return <LoginScreen onLogin={(s) => { setSesion(s); }} />;
  }
  // 2) Sesión Master → consola interna de Mattika (sin shell normal)
  if (sesion.tipo === 'master') {
    const [masterToast, masterToastNode] = [toast, toastNode];
    return (
      <div style={{minHeight:'100vh', background:'var(--bg)'}}>
        <ScreenMattikaAdmin
          onToast={masterToast}
          onCerrarSesion={() => { cerrarSesion(); setSesion(null); }}
        />
        {masterToastNode}
      </div>
    );
  }

  // ─── Empresa actual ─────────────────────────────────────────
  const empresas = loadEmpresas();
  const empresaActual = empresas.find((e) => e.id === sesion.empresaId);
  // Contexto actual (proyecto + etapa) — desde el helper que vive en auth.jsx
  const proyectoActualObj = window.getProyectoActual?.();
  const etapaActualObj    = window.getEtapaActual?.();
  const proyectoActual = proyectoActualObj?.nombre || sesion.proyecto || '—';
  const empresaColor = empresaActual?.color || 'var(--brand)';
  // Rol con privilegios de administración (controla ítems adminOnly del menú)
  const esAdmin = ['Administrador', 'Gerente'].includes(sesion?.rol);
  const can = (p) => window.can?.(p) ?? false;
  // Clave de alcance activo — al cambiar de proyecto/etapa, las pantallas
  // dependientes (plano, lotes) se remontan para releer su data aislada.
  const scopeKey = window.getScopeKey?.() || '_default';

  const logout = () => {
    cerrarSesion();
    setSesion(null);
  };

  return (
    <div className={`app ${sidebarCollapsed ? 'sidebar-collapsed' : ''} ${mobileNav ? 'mobile-nav-open' : ''}`}>
      {/* Backdrop del menú móvil */}
      <div className="mobile-nav-backdrop" onClick={() => setMobileNav(false)}></div>
      {/* Sidebar */}
      <aside className="sidebar">
        <button className="sidebar-toggle"
          onClick={toggleSidebar}
          title={sidebarCollapsed ? 'Expandir menú' : 'Colapsar menú'}
          aria-label="Alternar menú lateral">
          <Icon name="chevronL" size={13} />
        </button>

        <div className="brand">
          <div className="brand-mark" style={{ background: `linear-gradient(140deg, ${empresaColor} 0%, var(--brand-ink) 100%)` }}>M</div>
          <div>
            <div className="brand-name" style={{ fontFamily: "\"Open Sans\"" }}>Mattika</div>
            <div className="brand-sub" title={`${empresaActual?.nombre} · ${proyectoActual}`}>{proyectoActual}</div>
          </div>
        </div>

        <div className="nav-group-label">Principal</div>
        {NAV.filter((n) => n.group === 'principal' && (!n.perm || can(n.perm))).map((n) =>
        <button key={n.id}
          data-label={n.label}
          className={`nav-item ${route === n.id && !wizardOpen && !preview ? 'active' : ''}`}
          onClick={() => goto(n.id)}>
            <Icon name={n.icon} size={16} />
            <span>{n.label}</span>
            {n.badge && <span className="badge">{n.badge}</span>}
          </button>
        )}

        <div className="nav-group-label">Configuración</div>
        {NAV.filter((n) => n.group === 'config' && (!n.perm || can(n.perm))).map((n) =>
        <button key={n.id}
          data-label={n.label}
          className={`nav-item ${route === n.id && !wizardOpen && !preview ? 'active' : ''}`}
          onClick={() => goto(n.id)}>
            <Icon name={n.icon} size={16} />
            <span>{n.label}</span>
          </button>
        )}

        <div className="sidebar-footer">
          <UserCard sesion={sesion} empresa={empresaActual} onLogout={logout} />
        </div>
      </aside>

      {/* Main */}
      <div className="main">
        <header className="topbar">
          <button className="topbar-hamburger" onClick={() => setMobileNav(true)} aria-label="Abrir menú">
            <Icon name="menu" size={18} />
          </button>
          <div className="crumbs">
            <span>Mattika System</span>
            {crumbs.map((c, i, arr) =>
            <React.Fragment key={i}>
                <span className="sep"><Icon name="chevronR" size={12} /></span>
                <span className={i === arr.length - 1 ? 'cur' : ''}>{c}</span>
              </React.Fragment>
            )}
          </div>
          <div className="search" onClick={() => setSearchOpen(true)} style={{ cursor: 'pointer' }}>
            <Icon name="search" size={14} />
            <input placeholder="Buscar contratos, clientes, inmuebles..." readOnly style={{ cursor: 'pointer' }} />
            <span className="kbd">⌘K</span>
          </div>
          <div className="topbar-actions">
            <ContextoSwitcher empresa={empresaActual} onToast={toast}/>
            <button className="icon-btn" onClick={() => {toast('Recargando datos...');setTimeout(() => toast('✓ Datos actualizados'), 800);}}>
              <Icon name="refresh" size={14} />
            </button>
            <div style={{ position: 'relative' }}>
              <button className="icon-btn" onClick={() => setNotifOpen(!notifOpen)}>
                <Icon name="bell" size={14} />
                <span className="dot" />
              </button>
              {notifOpen && <NotificacionesDropdown onClose={() => setNotifOpen(false)} onGoto={goto} />}
            </div>
            <button className="btn primary" onClick={() => startNew()}>
              <Icon name="plus" size={14} /> Nuevo
            </button>
          </div>
        </header>

        <main>
          {curScreen === 'dashboard' && <ScreenDashboard onNew={startNew} onOpenContract={openContract} onGoto={goto} />}
          {curScreen === 'contracts' && <ScreenContracts onOpenContract={openContract} onNew={startNew} initialFilterStatus={routeParams.status} />}
          {curScreen === 'clients' && <ScreenClients onToast={toast} />}
          {curScreen === 'plano' && <ScreenPlano key={scopeKey} onNew={startNew} onToast={toast} />}
          {curScreen === 'inmuebles' && <ScreenLotesAdmin key={scopeKey} onToast={toast} onGoto={goto} />}
          {curScreen === 'admin' && <ScreenAdminHub onGoto={goto} onToast={toast} />}
          {curScreen === 'condiciones' && <ScreenCondiciones onGoto={goto} onToast={toast} />}
          {curScreen === 'correo' && <ScreenCorreo onGoto={goto} onToast={toast} />}
          {curScreen === 'proyectos' && <ScreenProyectos onGoto={goto} onToast={toast} />}
          {curScreen === 'pagos' && <ScreenPagos initialFilter={routeParams.filter} onToast={toast} />}
          {curScreen === 'templates' && <ScreenTemplateEditor onToast={toast} isAdmin={true} />}
          {curScreen === 'asesores' && <ScreenAsesores onToast={toast} />}
          {curScreen === 'settings' && <ScreenSettings onToast={toast} t={t} setTweak={setTweak} />}
          {curScreen === 'wizard' && <ScreenWizard initialData={wizardInitial}
          onCancel={() => {setWizardOpen(false);}}
          onGenerate={handleGenerate} />}
          {curScreen === 'preview' && <ScreenPreview data={preview} onBack={() => setPreview(null)} onToast={toast} />}
        </main>
      </div>

      {/* Tweaks */}
      <TweaksPanel title="Tweaks · Mattika">
        <TweakSection label="Marca" />
        <TweakColor label="Color de marca"
        value={t.brandColor}
        options={['#1E4FD4', '#0F3D8A', '#1F6FEB', '#0C7A6B', '#7A4DB5', '#0B1A33']}
        onChange={(v) => setTweak('brandColor', v)} />
        <TweakSection label="Apariencia" />
        <TweakToggle label="Modo oscuro" value={t.dark} onChange={(v) => setTweak('dark', v)} />
      </TweaksPanel>

      {toastNode}
      {searchOpen && <GlobalSearch onClose={() => setSearchOpen(false)} onGoto={goto} onOpenContract={openContract} />}
    </div>);

};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
